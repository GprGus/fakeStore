<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniShop — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f6f3ee;--bg2:#fff;--text:#1a1714;--text2:#6b6560;--text3:#9e9892;
      --accent:#c8613a;--accent-h:#b5542f;--accent-l:#fdf0eb;
      --border:#e8e3dc;--border-l:#f0ece6;
      --green:#3a8a5c;--green-l:#edf7f1;--red:#c0392b;--red-l:#fdf0ee;--blue:#2d6bcf;--blue-l:#edf2fb;
      --r:12px;--rs:8px;--font:'DM Sans',sans-serif;--disp:'Playfair Display',Georgia,serif;
      --t:0.25s cubic-bezier(0.4,0,0.2,1);
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

    /* ─── LAYOUT ─── */
    .admin-header{background:var(--text);color:#fff;padding:0 clamp(16px,4vw,48px);height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .admin-header h1{font-family:var(--disp);font-size:1.2rem;font-weight:700;letter-spacing:-0.02em}
    .admin-header h1 span{color:var(--accent)}
    .admin-header nav{display:flex;gap:4px}
    .nav-btn{font-family:var(--font);font-size:0.8rem;font-weight:600;padding:6px 16px;border:none;border-radius:100px;cursor:pointer;transition:var(--t);background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)}
    .nav-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
    .nav-btn.active{background:var(--accent);color:#fff}
    .btn-logout{background:rgba(200,97,58,0.2);color:var(--accent)}
    .btn-logout:hover{background:var(--accent);color:#fff}
    .container{max-width:1100px;margin:0 auto;padding:24px clamp(16px,4vw,48px)}

    /* ─── LOGIN ─── */
    .login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:var(--bg2);border:1px solid var(--border-l);border-radius:var(--r);padding:40px 36px;width:min(400px,90vw);box-shadow:0 8px 32px rgba(26,23,20,0.08)}
    .login-card h2{font-family:var(--disp);font-size:1.5rem;margin-bottom:4px}
    .login-card p{font-size:0.85rem;color:var(--text2);margin-bottom:24px}
    .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .fg label{font-size:0.82rem;font-weight:600}
    .fg input,.fg textarea,.fg select{font-family:var(--font);font-size:0.88rem;padding:10px 14px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);color:var(--text);transition:var(--t)}
    .fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,97,58,0.1)}
    .fg textarea{resize:vertical;min-height:80px}
    .btn{font-family:var(--font);font-size:0.85rem;font-weight:600;padding:12px 24px;border:none;border-radius:var(--rs);cursor:pointer;transition:var(--t)}
    .btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-h)}
    .btn-accent:disabled{opacity:0.5;cursor:not-allowed}
    .btn-ghost{background:none;border:1px solid var(--border);color:var(--text2)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
    .btn-red{background:none;border:1px solid var(--red);color:var(--red)}.btn-red:hover{background:var(--red-l)}
    .err{color:var(--red);font-size:0.82rem;margin-bottom:8px;display:none}
    .spinner-s{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ─── STATS ─── */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
    .stat-card{background:var(--bg2);border:1px solid var(--border-l);border-radius:var(--r);padding:20px 22px;transition:var(--t)}
    .stat-card:hover{box-shadow:0 4px 16px rgba(26,23,20,0.06)}
    .stat-card__label{font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin-bottom:4px}
    .stat-card__value{font-family:var(--disp);font-size:1.6rem;font-weight:700}

    /* ─── SECTIONS ─── */
    .section-title{font-family:var(--disp);font-size:1.15rem;font-weight:700;margin-bottom:16px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
    @media(max-width:700px){.grid-2{grid-template-columns:1fr}}

    .card{background:var(--bg2);border:1px solid var(--border-l);border-radius:var(--r);padding:20px;transition:var(--t)}
    .card:hover{box-shadow:0 4px 16px rgba(26,23,20,0.06)}

    /* ─── TABLES ─── */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:0.84rem}
    th{text-align:left;font-weight:600;color:var(--text3);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;padding:10px 12px;border-bottom:1px solid var(--border)}
    td{padding:10px 12px;border-bottom:1px solid var(--border-l);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:0.72rem;font-weight:700}
    .rank-1{background:var(--accent-l);color:var(--accent)}
    .rank-2{background:var(--blue-l);color:var(--blue)}
    .rank-3{background:var(--green-l);color:var(--green)}

    .prod-thumb{width:40px;height:40px;border-radius:var(--rs);object-fit:contain;background:var(--bg);border:1px solid var(--border-l);padding:4px}
    .status-pill{font-size:0.7rem;font-weight:600;padding:2px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:0.03em}
    .status-completed{background:var(--green-l);color:var(--green)}
    .status-active{background:var(--green-l);color:var(--green)}
    .status-inactive{background:var(--red-l);color:var(--red)}

    /* ─── PRODUCT FORM ─── */
    .product-form-overlay{position:fixed;inset:0;background:rgba(26,23,20,0.3);z-index:100;display:none;align-items:center;justify-content:center}
    .product-form-overlay.open{display:flex}
    .product-form{background:var(--bg2);border-radius:var(--r);width:min(520px,92vw);max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(26,23,20,0.15);padding:28px}
    .product-form h3{font-family:var(--disp);font-size:1.15rem;margin-bottom:20px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-actions{display:flex;gap:10px;margin-top:16px}

    .empty{text-align:center;padding:32px 0;color:var(--text3);font-size:0.88rem}

    /* ─── IMAGE UPLOAD ─── */
    .img-upload{border:2px dashed var(--border);border-radius:var(--rs);overflow:hidden;transition:var(--t)}
    .img-upload.dragover{border-color:var(--accent);background:var(--accent-l)}
    .img-upload__drop{padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--text3);text-align:center}
    .img-upload__drop svg{stroke:var(--border);margin-bottom:4px}
    .img-upload__drop span{font-size:0.84rem;font-weight:500;color:var(--text2)}
    .img-upload__drop small{font-size:0.72rem}
    .img-upload__drop:hover span{color:var(--accent)}
    .img-upload__preview{position:relative;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:12px;min-height:120px}
    .img-upload__preview img{max-height:160px;max-width:100%;object-fit:contain;border-radius:4px}
    .img-upload__remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:var(--text);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t);line-height:1}
    .img-upload__remove:hover{background:var(--red)}

    /* ─── PAGE VIEWS ─── */
    .page{display:none}.page.active{display:block}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  </style>
</head>
<body>

<div id="app">
  <!-- LOGIN -->
  <div class="page active" id="pageLogin">
    <div class="login-wrap">
      <div class="login-card">
        <h2>Admin Panel</h2>
        <p>Sign in with your admin credentials</p>
        <div class="fg"><label>Username</label><input type="text" id="aUser" placeholder="admin" /></div>
        <div class="fg"><label>Password</label><input type="password" id="aPass" placeholder="••••••••" /></div>
        <div class="err" id="aErr"></div>
        <button class="btn btn-accent" style="width:100%" id="aLogin">Sign In</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="page" id="pageMain">
    <header class="admin-header">
      <h1>Mini<span>Shop</span> Admin</h1>
      <nav>
        <button class="nav-btn active" data-page="dashboard">Dashboard</button>
        <button class="nav-btn" data-page="products">Products</button>
        <button class="nav-btn" data-page="categories">Categories</button>
        <button class="nav-btn btn-logout" id="aLogout">Logout</button>
      </nav>
    </header>

    <!-- DASHBOARD -->
    <div class="page active" id="pageDashboard">
      <div class="container">
        <div class="stats" id="statsCards"></div>
        <div class="grid-2">
          <div class="card">
            <div class="section-title">Top buyers</div>
            <div class="table-wrap" id="topBuyers"></div>
          </div>
          <div class="card">
            <div class="section-title">Best-selling products</div>
            <div class="table-wrap" id="bestSelling"></div>
          </div>
        </div>
        <div class="card">
          <div class="section-title">Recent orders</div>
          <div class="table-wrap" id="recentOrders"></div>
        </div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="page" id="pageProducts">
      <div class="container">
        <div class="toolbar">
          <div class="section-title" style="margin-bottom:0">Product catalog</div>
          <button class="btn btn-accent" id="btnAddProduct">+ Add Product</button>
        </div>
        <div class="card">
          <div class="table-wrap" id="productTable"></div>
        </div>
      </div>
    </div>

    <!-- CATEGORIES -->
    <div class="page" id="pageCategories">
      <div class="container">
        <div class="toolbar">
          <div class="section-title" style="margin-bottom:0">Categories</div>
          <div style="display:flex;gap:8px;align-items:center">
            <input type="text" id="newCatName" placeholder="New category name" style="font-family:var(--font);font-size:0.85rem;padding:8px 14px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg2)" />
            <button class="btn btn-accent" id="btnAddCat" style="white-space:nowrap">+ Add</button>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap" id="categoryTable"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCT FORM MODAL -->
<div class="product-form-overlay" id="prodOverlay">
  <div class="product-form" id="prodForm">
    <h3 id="prodFormTitle">Add product</h3>
    <input type="hidden" id="prodId" />
    <div class="fg"><label>Title</label><input type="text" id="prodTitle" placeholder="Product name" /></div>
    <div class="fg"><label>Description</label><textarea id="prodDesc" placeholder="Product description..."></textarea></div>
    <div class="form-row">
      <div class="fg"><label>Price ($)</label><input type="number" id="prodPrice" step="0.01" min="0" placeholder="29.99" /></div>
      <div class="fg"><label>Category</label><select id="prodCat"><option value="">Select a category</option></select></div>
    </div>
    <div class="fg">
      <label>Image</label>
      <div class="img-upload" id="imgUploadArea">
        <div class="img-upload__preview" id="imgPreview" style="display:none">
          <img id="imgPreviewSrc" alt="" />
          <button type="button" class="img-upload__remove" id="imgRemove" title="Remove">&times;</button>
        </div>
        <div class="img-upload__drop" id="imgDrop">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
          <span>Click to upload or drag image here</span>
          <small>JPG, PNG, WebP — max 2MB</small>
        </div>
        <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp" style="display:none" />
      </div>
      <div style="text-align:center;font-size:0.75rem;color:var(--text3);margin:8px 0 4px">— or paste a URL —</div>
      <input type="text" id="prodImg" placeholder="https://example.com/image.jpg" />
    </div>
    <div class="err" id="prodErr"></div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="prodCancel">Cancel</button>
      <button class="btn btn-accent" id="prodSave">Save product</button>
    </div>
  </div>
</div>

<script>
  let admin = null;

  // ─── NAV ───
  document.querySelectorAll('[data-page]').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pageDashboard').classList.toggle('active', btn.dataset.page === 'dashboard');
    document.getElementById('pageProducts').classList.toggle('active', btn.dataset.page === 'products');
    document.getElementById('pageCategories').classList.toggle('active', btn.dataset.page === 'categories');
    if (btn.dataset.page === 'dashboard') loadDashboard();
    if (btn.dataset.page === 'products') loadProducts();
    if (btn.dataset.page === 'categories') loadCategories();
  });

  // ─── LOGIN ───
  document.getElementById('aLogin').onclick = async () => {
    const u = document.getElementById('aUser').value.trim();
    const p = document.getElementById('aPass').value;
    const err = document.getElementById('aErr');
    const btn = document.getElementById('aLogin');
    if (!u || !p) { err.textContent = 'Fill in both fields'; err.style.display = 'block'; return; }
    btn.innerHTML = `<span class="spinner-s"></span> Signing in…`; btn.disabled = true; err.style.display = 'none';
    try {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      admin = data.admin;
      document.getElementById('pageLogin').classList.remove('active');
      document.getElementById('pageMain').classList.add('active');
      loadDashboard();
      loadProducts();
      loadCategories();
    } catch (e) {
      err.textContent = e.message || 'Invalid credentials'; err.style.display = 'block';
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  };
  document.getElementById('aPass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('aLogin').click(); });

  // ─── LOGOUT ───
  document.getElementById('aLogout').onclick = () => {
    admin = null;
    document.getElementById('pageMain').classList.remove('active');
    document.getElementById('pageLogin').classList.add('active');
    document.getElementById('aUser').value = ''; document.getElementById('aPass').value = '';
    document.getElementById('aLogin').textContent = 'Sign In'; document.getElementById('aLogin').disabled = false;
  };

  // ─── DASHBOARD ───
  async function loadDashboard() {
    try {
      const res = await fetch('/api/admin/dashboard');
      const { stats, topBuyers, bestSelling, recentOrders } = await res.json();

      document.getElementById('statsCards').innerHTML = [
        { label: 'Total users', value: stats.totalUsers, color: 'var(--blue)' },
        { label: 'Total orders', value: stats.totalOrders, color: 'var(--green)' },
        { label: 'Revenue', value: `$${stats.totalRevenue.toFixed(2)}`, color: 'var(--accent)' },
        { label: 'Products', value: stats.totalProducts, color: 'var(--text)' },
      ].map(s => `<div class="stat-card"><div class="stat-card__label">${s.label}</div><div class="stat-card__value" style="color:${s.color}">${s.value}</div></div>`).join('');

      // Top buyers
      document.getElementById('topBuyers').innerHTML = topBuyers.length === 0
        ? `<div class="empty">No purchases yet</div>`
        : `<table><thead><tr><th>#</th><th>Customer</th><th>Orders</th><th>Total spent</th></tr></thead><tbody>${
          topBuyers.map((b, i) => `<tr><td><span class="rank rank-${i+1}">${i+1}</span></td><td>${b.firstname || ''} ${b.lastname || ''}<br><small style="color:var(--text3)">${b.email}</small></td><td>${b.orderCount}</td><td style="font-weight:600">$${b.totalSpent.toFixed(2)}</td></tr>`).join('')
        }</tbody></table>`;

      // Best selling
      document.getElementById('bestSelling').innerHTML = bestSelling.length === 0
        ? `<div class="empty">No sales yet</div>`
        : `<table><thead><tr><th></th><th>Product</th><th>Sold</th><th>Revenue</th></tr></thead><tbody>${
          bestSelling.map(p => `<tr><td>${p.image ? `<img class="prod-thumb" src="${p.image}" />` : ''}</td><td>${p.title.length > 30 ? p.title.slice(0,30)+'…' : p.title}</td><td>${p.totalQty}</td><td style="font-weight:600">$${p.totalRevenue.toFixed(2)}</td></tr>`).join('')
        }</tbody></table>`;

      // Recent orders
      document.getElementById('recentOrders').innerHTML = recentOrders.length === 0
        ? `<div class="empty">No orders yet</div>`
        : `<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody>${
          recentOrders.map(o => {
            const user = o.userId;
            const name = user ? `${user.name?.firstname || ''} ${user.name?.lastname || ''}`.trim() || user.username : '—';
            const date = new Date(o.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            return `<tr><td style="font-weight:600">${o.orderId}</td><td>${name}</td><td>${o.items.length}</td><td style="font-weight:600">$${o.total.toFixed(2)}</td><td><span class="status-pill status-${o.status}">${o.status}</span></td><td style="color:var(--text3)">${date}</td></tr>`;
          }).join('')
        }</tbody></table>`;
    } catch (e) {
      console.error('Dashboard error:', e);
    }
  }

  // ─── PRODUCTS TABLE ───
  let allProducts = [];

  async function loadProducts() {
    try {
      const res = await fetch('/api/admin/products');
      const data = await res.json();
      allProducts = data.products || [];
      renderProductTable();
    } catch (e) { console.error('Products error:', e); }
  }

  function renderProductTable() {
    const el = document.getElementById('productTable');
    if (allProducts.length === 0) {
      el.innerHTML = `<div class="empty">No products yet. Click "Add Product" to create your first one.</div>`;
      return;
    }
    el.innerHTML = `<table><thead><tr><th></th><th>Title</th><th>Category</th><th>Price</th><th>Rating</th><th>Status</th><th>Actions</th></tr></thead><tbody>${
      allProducts.map(p => `<tr>
        <td>${p.image ? `<img class="prod-thumb" src="${p.image}" />` : ''}</td>
        <td style="font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.title}</td>
        <td><span style="text-transform:capitalize">${p.categoryName || 'uncategorized'}</span></td>
        <td style="font-weight:600">$${p.price.toFixed(2)}</td>
        <td>${p.rating?.rate || 0} <small style="color:var(--text3)">(${p.rating?.count || 0})</small></td>
        <td><span class="status-pill status-${p.active ? 'active' : 'inactive'}">${p.active ? 'active' : 'inactive'}</span></td>
        <td>
          <button class="btn btn-ghost" style="padding:4px 12px;font-size:0.78rem" onclick="editProduct('${p._id}')">Edit</button>
          <button class="btn btn-red" style="padding:4px 12px;font-size:0.78rem;margin-left:4px" onclick="toggleProduct('${p._id}', ${p.active})">${p.active ? 'Disable' : 'Enable'}</button>
        </td>
      </tr>`).join('')
    }</tbody></table>`;
  }

  // ─── IMAGE UPLOAD ───
  let uploadedImageData = null;
  const imgFile = document.getElementById('imgFile');
  const imgDrop = document.getElementById('imgDrop');
  const imgPreview = document.getElementById('imgPreview');
  const imgPreviewSrc = document.getElementById('imgPreviewSrc');
  const imgUploadArea = document.getElementById('imgUploadArea');

  function showImagePreview(src) {
    uploadedImageData = src;
    imgPreviewSrc.src = src;
    imgPreview.style.display = 'flex';
    imgDrop.style.display = 'none';
    document.getElementById('prodImg').value = '';
  }

  function clearImagePreview() {
    uploadedImageData = null;
    imgPreviewSrc.src = '';
    imgPreview.style.display = 'none';
    imgDrop.style.display = 'flex';
  }

  function handleImageFile(file) {
    if (!file) return;
    if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {
      alert('Only JPG, PNG and WebP images are accepted'); return;
    }
    if (file.size > 2 * 1024 * 1024) {
      alert('Image must be under 2MB'); return;
    }
    const reader = new FileReader();
    reader.onload = (e) => showImagePreview(e.target.result);
    reader.readAsDataURL(file);
  }

  imgDrop.onclick = () => imgFile.click();
  imgFile.onchange = (e) => handleImageFile(e.target.files[0]);
  document.getElementById('imgRemove').onclick = (e) => { e.stopPropagation(); clearImagePreview(); imgFile.value = ''; };

  // Drag & drop
  imgUploadArea.addEventListener('dragover', (e) => { e.preventDefault(); imgUploadArea.classList.add('dragover'); });
  imgUploadArea.addEventListener('dragleave', () => imgUploadArea.classList.remove('dragover'));
  imgUploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    imgUploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleImageFile(file);
  });

  // URL input clears upload and vice versa
  document.getElementById('prodImg').addEventListener('input', (e) => {
    if (e.target.value.trim()) { clearImagePreview(); imgFile.value = ''; }
  });

  // ─── PRODUCT FORM ───
  const overlay = document.getElementById('prodOverlay');
  document.getElementById('btnAddProduct').onclick = () => openProductForm();
  document.getElementById('prodCancel').onclick = () => overlay.classList.remove('open');
  overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };

  function openProductForm(product) {
    document.getElementById('prodFormTitle').textContent = product ? 'Edit product' : 'Add product';
    document.getElementById('prodId').value = product?._id || '';
    document.getElementById('prodTitle').value = product?.title || '';
    document.getElementById('prodDesc').value = product?.description || '';
    document.getElementById('prodPrice').value = product?.price ?? '';
    document.getElementById('prodErr').style.display = 'none';
    imgFile.value = '';

    // Populate category dropdown
    const catSelect = document.getElementById('prodCat');
    const catId = product?.category?._id || product?.category || '';
    catSelect.innerHTML = '<option value="">Select a category</option>' +
      allCategories.map(c => `<option value="${c._id}"${catId === c._id ? ' selected' : ''}>${c.name}</option>`).join('');

    // Image
    const existingImg = product?.image || '';
    if (existingImg && existingImg.startsWith('data:')) {
      showImagePreview(existingImg);
      document.getElementById('prodImg').value = '';
    } else {
      clearImagePreview();
      document.getElementById('prodImg').value = existingImg;
    }

    overlay.classList.add('open');
  }

  window.editProduct = (id) => {
    const p = allProducts.find(x => x._id === id);
    if (p) openProductForm(p);
  };

  window.toggleProduct = async (id, isActive) => {
    try {
      await fetch(`/api/products/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ active: !isActive })
      });
      loadProducts();
    } catch (e) { console.error(e); }
  };

  document.getElementById('prodSave').onclick = async () => {
    const id = document.getElementById('prodId').value;
    const title = document.getElementById('prodTitle').value.trim();
    const description = document.getElementById('prodDesc').value.trim();
    const price = parseFloat(document.getElementById('prodPrice').value);
    const category = document.getElementById('prodCat').value;
    const image = uploadedImageData || document.getElementById('prodImg').value.trim();
    const err = document.getElementById('prodErr');
    const btn = document.getElementById('prodSave');

    if (!title || isNaN(price) || !category) {
      err.textContent = 'Title, price and category are required'; err.style.display = 'block'; return;
    }

    btn.innerHTML = `<span class="spinner-s"></span> Saving…`; btn.disabled = true; err.style.display = 'none';

    const body = { title, description, price, category, image };
    const url = id ? `/api/products/${id}` : '/api/products';
    const method = id ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      overlay.classList.remove('open');
      loadProducts();
      loadDashboard();
    } catch (e) {
      err.textContent = e.message || 'Failed to save'; err.style.display = 'block';
    }
    btn.textContent = 'Save product'; btn.disabled = false;
  };

  // ─── CATEGORIES ───
  let allCategories = [];

  async function loadCategories() {
    try {
      const res = await fetch('/api/categories');
      const data = await res.json();
      allCategories = data.categories || [];
      renderCategoryTable();
    } catch (e) { console.error('Categories error:', e); }
  }

  function renderCategoryTable() {
    const el = document.getElementById('categoryTable');
    if (allCategories.length === 0) {
      el.innerHTML = `<div class="empty">No categories yet. Add one above.</div>`;
      return;
    }
    el.innerHTML = `<table><thead><tr><th>Name</th><th>Created</th><th>Actions</th></tr></thead><tbody>${
      allCategories.map(c => {
        const date = new Date(c.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        return `<tr>
          <td style="font-weight:500;text-transform:capitalize">${c.name}</td>
          <td style="color:var(--text3)">${date}</td>
          <td><button class="btn btn-red" style="padding:4px 12px;font-size:0.78rem" onclick="deleteCategory('${c._id}')">Delete</button></td>
        </tr>`;
      }).join('')
    }</tbody></table>`;
  }

  document.getElementById('btnAddCat').onclick = async () => {
    const input = document.getElementById('newCatName');
    const name = input.value.trim();
    if (!name) return;
    try {
      const res = await fetch('/api/categories', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Failed'); return; }
      input.value = '';
      loadCategories();
    } catch (e) { console.error(e); }
  };

  document.getElementById('newCatName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnAddCat').click();
  });

  window.deleteCategory = async (id) => {
    if (!confirm('Delete this category?')) return;
    try {
      await fetch(`/api/categories/${id}`, { method: 'DELETE' });
      loadCategories();
    } catch (e) { console.error(e); }
  };
</script>
</body>
</html>
