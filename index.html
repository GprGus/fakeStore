<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f6f3ee;
      --bg-card: #ffffff;
      --bg-cart: #fdfcfa;
      --text: #1a1714;
      --text-secondary: #6b6560;
      --text-muted: #9e9892;
      --accent: #c8613a;
      --accent-hover: #b5542f;
      --accent-light: #fdf0eb;
      --border: #e8e3dc;
      --border-light: #f0ece6;
      --star-filled: #e8a838;
      --star-empty: #ddd6cc;
      --green: #3a8a5c;
      --green-light: #edf7f1;
      --red: #c0392b;
      --red-light: #fdf0ee;
      --shadow-sm: 0 1px 3px rgba(26,23,20,0.04);
      --shadow-md: 0 4px 16px rgba(26,23,20,0.06);
      --shadow-lg: 0 8px 32px rgba(26,23,20,0.10);
      --radius: 12px;
      --radius-sm: 8px;
      --font-body: 'DM Sans', sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(246,243,238,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
      padding: 0 clamp(16px, 4vw, 48px);
      height: 68px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .header-btn {
      position: relative; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition);
    }

    .header-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
    .header-btn svg { width: 20px; height: 20px; stroke: var(--text); fill: none; }
    /* .header-btn.logged-in { border-color: var(--accent); background: var(--accent-light); } */
    .header-btn__avatar { width: 100%; height: 100%; object-fit: cover; display: none; overflow: hidden; }
    .header-btn.has-avatar svg { display: none; }
    .header-btn.has-avatar .header-btn__avatar { display: block; }

    .cart-badge {
      position: absolute; top: -6px; right: -6px; background: var(--accent);
      color: #fff; font-size: 11px; font-weight: 600; width: 20px; height: 20px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0); transition: var(--transition);
    }
    .cart-badge.visible { opacity: 1; transform: scale(1); z-index: 1; }

    /* ─── FILTERS ─── */
    .filters { padding: 24px clamp(16px, 4vw, 48px) 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--font-body); font-size: 0.835rem; font-weight: 500;
      padding: 8px 18px; border-radius: 100px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
      transition: var(--transition); text-transform: capitalize; white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--text); border-color: var(--text); color: #fff; }

    /* ─── PRODUCT GRID ─── */
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; padding: 24px clamp(16px, 4vw, 48px) 48px; list-style: none;
    }

    .product-card {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
      transition: var(--transition); animation: cardIn 0.4s ease both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .product-card:hover { box-shadow: var(--shadow-lg); border-color: var(--border); transform: translateY(-2px); }

    .product-card__image {
      position: relative; height: 220px; padding: 28px;
      display: flex; align-items: center; justify-content: center; background: #fff;
    }
    .product-card__image img { max-height: 100%; max-width: 100%; object-fit: contain; transition: transform 0.4s ease; }
    .product-card:hover .product-card__image img { transform: scale(1.05); }

    .product-card__category {
      position: absolute; top: 12px; left: 12px; font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
      background: var(--bg); padding: 3px 10px; border-radius: 100px;
    }

    .product-card__body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .product-card__title {
      font-size: 0.92rem; font-weight: 600; line-height: 1.4; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-clamp: 2;
    }

    /* ─── RATING ─── */
    .rating { display: flex; align-items: center; gap: 6px; }
    .rating__stars { display: flex; gap: 1px; position: relative; }
    .rating__stars-bg, .rating__stars-fill { display: flex; gap: 1px; }
    .rating__stars-fill { position: absolute; top: 0; left: 0; overflow: hidden; }
    .rating__star { width: 14px; height: 14px; flex-shrink: 0; }
    .rating__star--empty { color: var(--star-empty); }
    .rating__star--filled { color: var(--star-filled); }
    .rating__score { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .rating__count { font-size: 0.75rem; color: var(--text-muted); }

    /* ─── PRICE & ADD ─── */
    .product-card__footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding: 0 18px 18px; }
    .product-card__price { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .add-btn {
      font-family: var(--font-body); font-size: 0.8rem; font-weight: 600;
      padding: 10px 18px; border: none; border-radius: var(--radius-sm);
      background: var(--text); color: #fff; cursor: pointer; transition: var(--transition);
    }
    .add-btn:hover { background: var(--accent); }
    .add-btn:active { transform: scale(0.96); }
    .add-btn.added { background: var(--accent); animation: pop 0.3s ease; }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

    /* ─── GENERIC DRAWER ─── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(26,23,20,0.25);
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }

    .drawer {
      position: fixed; top: 0; right: 0; width: min(440px, 92vw); height: 100%;
      background: var(--bg-cart); z-index: 201; transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
      box-shadow: -8px 0 40px rgba(26,23,20,0.08);
    }
    .drawer.open { transform: translateX(0); }

    .drawer__header {
      padding: 20px 24px; border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .drawer__header h2 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
    .drawer__close {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: none; cursor: pointer; transition: var(--transition);
    }
    .drawer__close:hover { border-color: var(--accent); }
    .drawer__close svg { width: 16px; height: 16px; stroke: var(--text); }

    .drawer__body { flex: 1; overflow-y: auto; padding: 16px 24px; }
    .drawer__footer { padding: 20px 24px; border-top: 1px solid var(--border-light); flex-shrink: 0; }

    /* ─── CART ─── */
    .cart-empty { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 0.9rem; }
    .cart-empty svg { width: 48px; height: 48px; stroke: var(--border); margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
    .cart-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border-light); animation: slideIn 0.25s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
    .cart-item__image {
      width: 56px; height: 56px; flex-shrink: 0; background: #fff;
      border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; padding: 6px;
    }
    .cart-item__image img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .cart-item__info { flex: 1; min-width: 0; }
    .cart-item__title { font-size: 0.83rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item__price { font-size: 0.8rem; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .cart-item__controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card);
      cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text); transition: var(--transition);
    }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cart-item__qty { font-size: 0.85rem; font-weight: 600; min-width: 20px; text-align: center; }
    .remove-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer; margin-left: auto; opacity: 0.4; transition: var(--transition);
    }
    .remove-btn:hover { opacity: 1; }
    .remove-btn svg { width: 16px; height: 16px; stroke: var(--accent); }

    .cart-total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    .cart-total__label { font-size: 0.9rem; color: var(--text-secondary); }
    .cart-total__value { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
    .cart-actions { display: flex; gap: 10px; }

    .btn-secondary {
      font-family: var(--font-body); font-size: 0.83rem; font-weight: 500;
      padding: 12px 20px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: none; color: var(--text-secondary); cursor: pointer; transition: var(--transition);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .btn-primary {
      font-family: var(--font-body); font-size: 0.85rem; font-weight: 600;
      padding: 12px 20px; border: none; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; cursor: pointer; transition: var(--transition); flex: 1;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── PROFILE DRAWER ─── */
    .profile-avatar-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 24px; }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%; background: var(--border-light);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 3px solid var(--border); position: relative; cursor: pointer; transition: var(--transition);
    }
    .profile-avatar:hover { border-color: var(--accent); }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-avatar > svg { width: 32px; height: 32px; stroke: var(--text-muted); }
    .profile-avatar-overlay {
      position: absolute; inset: 0; background: rgba(26,23,20,0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: var(--transition); border-radius: 50%;
    }
    .profile-avatar:hover .profile-avatar-overlay { opacity: 1; }
    .profile-avatar-overlay svg { width: 20px; height: 20px; stroke: #fff; }

    .profile-name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
    .profile-email { font-size: 0.82rem; color: var(--text-muted); margin-top: -4px; }

    .profile-tabs { display: flex; border-bottom: 1px solid var(--border-light); margin-bottom: 16px; }
    .profile-tab {
      flex: 1; padding: 12px 0; font-family: var(--font-body); font-size: 0.83rem; font-weight: 600;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); cursor: pointer; transition: var(--transition); text-align: center;
    }
    .profile-tab:hover { color: var(--text); }
    .profile-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .form-group input {
      font-family: var(--font-body); font-size: 0.88rem; padding: 11px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text); transition: var(--transition);
    }
    .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,97,58,0.1); }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-group input:read-only { background: var(--border-light); color: var(--text-muted); cursor: default; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; margin-top: 8px; }

    .btn-save {
      font-family: var(--font-body); font-size: 0.83rem; font-weight: 600;
      padding: 10px 24px; border: none; border-radius: var(--radius-sm);
      background: var(--green); color: #fff; cursor: pointer; transition: var(--transition);
    }
    .btn-save:hover { background: #2e7a4e; }

    .btn-danger {
      font-family: var(--font-body); font-size: 0.83rem; font-weight: 600;
      padding: 10px 24px; border: 1px solid var(--red); border-radius: var(--radius-sm);
      background: none; color: var(--red); cursor: pointer; transition: var(--transition);
    }
    .btn-danger:hover { background: var(--red-light); }

    /* Order History */
    .order-card {
      background: var(--bg); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; animation: slideIn 0.25s ease;
    }
    .order-card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .order-card__id { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .order-card__date { font-size: 0.75rem; color: var(--text-muted); }
    .order-card__status {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 3px 10px; border-radius: 100px;
    }
    .order-card__status--completed { background: var(--green-light); color: var(--green); }
    .order-card__items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .order-card__item { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); }
    .order-card__item span:last-child { font-weight: 600; color: var(--text); }
    .order-card__total { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border-light); font-size: 0.85rem; font-weight: 700; }

    .empty-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.88rem; }
    .empty-state svg { width: 40px; height: 40px; stroke: var(--border); margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }

    /* Login inside drawer */
    .login-form-wrapper { padding: 16px 0; }
    .login-form-wrapper p { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
    .login-hint {
      background: var(--accent-light); border: 1px solid rgba(200,97,58,0.15);
      border-radius: var(--radius-sm); padding: 12px 14px; font-size: 0.78rem;
      color: var(--text-secondary); margin-top: 16px; line-height: 1.5;
    }
    .login-hint strong { color: var(--accent); }

    /* ─── LOADING ─── */
    .loading {
      grid-column: 1 / -1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      padding: 80px 0; color: var(--text-muted); font-size: 0.9rem;
    }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-sm { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text); color: #fff; padding: 12px 24px;
      border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500;
      z-index: 300; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none; max-width: 90vw; text-align: center;
    }
    .toast.visible { transform: translateX(-50%) translateY(0); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .product-card__image { height: 160px; padding: 16px; }
      .product-card__body { padding: 10px 12px 12px; }
      .product-card__footer { padding: 0 12px 12px; flex-direction: column; gap: 10px; align-items: stretch; }
      .add-btn { text-align: center; }
      .product-card__title { font-size: 0.82rem; }
      .product-card__price { font-size: 1.1rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">Mini<span>Shop</span></div>
    <div class="header-actions">
      <button class="header-btn" id="userToggle" aria-label="Account">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        <img class="header-btn__avatar" id="headerAvatar" alt="" />
      </button>
      <button class="header-btn" id="cartToggle" aria-label="Open cart">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <nav class="filters" id="filters"></nav>

  <ul class="product-grid" id="productGrid">
    <li class="loading"><div class="spinner"></div>Loading products...</li>
  </ul>

  <!-- CART DRAWER -->
  <div class="drawer-overlay" id="cartOverlay"></div>
  <aside class="drawer" id="cartDrawer">
    <div class="drawer__header">
      <h2>Your Cart</h2>
      <button class="drawer__close" id="cartClose" aria-label="Close cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="drawer__body" id="cartBody"></div>
    <div class="drawer__footer" id="cartFooter"></div>
  </aside>

  <!-- USER DRAWER -->
  <div class="drawer-overlay" id="userOverlay"></div>
  <aside class="drawer" id="userDrawer">
    <div class="drawer__header">
      <h2 id="userDrawerTitle">Account</h2>
      <button class="drawer__close" id="userClose" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="drawer__body" id="userBody"></div>
  </aside>

  <div class="toast" id="toast"></div>
  <input type="file" id="avatarInput" accept="image/*" style="display:none" />

  <script type="module">
    // ─── SVG CONSTANTS ───
    const STAR_SVG = `<svg class="rating__star" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
    const ICON_BAG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>`;
    const ICON_TRASH = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>`;
    const ICON_CAMERA = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" /><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" /></svg>`;
    const ICON_USER_LG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>`;
    const ICON_RECEIPT = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" /></svg>`;

    // ─── TOAST ───
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('visible'), 2200);
    }

    // ─── RENDER STARS ───
    function renderStars(rate) {
      const w = (rate / 5) * 100;
      let bg = '', fg = '';
      for (let i = 0; i < 5; i++) {
        bg += `<span class="rating__star--empty">${STAR_SVG}</span>`;
        fg += `<span class="rating__star--filled">${STAR_SVG}</span>`;
      }
      return `<div class="rating__stars"><div class="rating__stars-bg">${bg}</div><div class="rating__stars-fill" style="width:${w}%">${fg}</div></div>`;
    }

    // ─── PRODUCT ───
    class Product {
      constructor({ id, title, price, description, image, category, rating }) {
        Object.assign(this, { id, title, price, description, image, category, rating: rating || { rate: 0, count: 0 } });
      }
    }

    // ─── PRODUCT LIST ───
    class ProductList {
      constructor() { this.products = []; this.categories = []; this.currentCategory = 'All'; }

      async fetchProducts() {
        try {
          const data = await (await fetch('https://fakestoreapi.com/products')).json();
          this.products = data.map(d => new Product(d));
          this.categories = [...new Set(data.map(p => p.category))].sort();
          this.renderFilters();
          this.renderProducts();
        } catch {
          document.getElementById('productGrid').innerHTML = `<li class="loading" style="color:var(--accent)">Failed to load products.</li>`;
        }
      }

      renderFilters() {
        const nav = document.getElementById('filters');
        nav.innerHTML = '';
        ['All', ...this.categories].forEach(cat => {
          const btn = document.createElement('button');
          btn.className = `filter-btn${cat === this.currentCategory ? ' active' : ''}`;
          btn.textContent = cat;
          btn.addEventListener('click', () => {
            this.currentCategory = cat;
            nav.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
            this.renderProducts();
          });
          nav.appendChild(btn);
        });
      }

      renderProducts() {
        const grid = document.getElementById('productGrid');
        const list = this.currentCategory === 'All' ? this.products : this.products.filter(p => p.category === this.currentCategory);
        grid.innerHTML = '';
        list.forEach((p, i) => {
          const li = document.createElement('li');
          li.className = 'product-card';
          li.style.animationDelay = `${i * 0.04}s`;
          li.innerHTML = `
            <div class="product-card__image">
              <span class="product-card__category">${p.category}</span>
              <img src="${p.image}" alt="${p.title}" loading="lazy" />
            </div>
            <div class="product-card__body">
              <h3 class="product-card__title">${p.title}</h3>
              <div class="rating">${renderStars(p.rating.rate)}<span class="rating__score">${p.rating.rate}</span><span class="rating__count">(${p.rating.count})</span></div>
            </div>
            <div class="product-card__footer">
              <span class="product-card__price">$${p.price.toFixed(2)}</span>
              <button class="add-btn">Add to Cart</button>
            </div>`;
          li.querySelector('.add-btn').addEventListener('click', (e) => {
            cart.addItem(p);
            const b = e.currentTarget; b.textContent = 'Added!'; b.classList.add('added');
            setTimeout(() => { b.textContent = 'Add to Cart'; b.classList.remove('added'); }, 900);
          });
          grid.appendChild(li);
        });
      }
    }

    // ─── SHOPPING CART ───
    class ShoppingCart {
      static #inst;
      constructor() { this.items = []; this.total = 0; }
      static getInstance() { if (!ShoppingCart.#inst) ShoppingCart.#inst = new ShoppingCart(); return ShoppingCart.#inst; }

      #calc() { this.total = this.items.reduce((s, i) => s + i.product.price * i.quantity, 0); }

      addItem(product) {
        const ex = this.items.find(i => i.product.id === product.id);
        if (ex) ex.quantity++; else this.items.push({ product, quantity: 1 });
        this.#calc(); this.render();
        showToast(`${product.title.length > 28 ? product.title.slice(0, 28) + '…' : product.title} added`);
      }

      changeQty(idx, d) {
        const it = this.items[idx]; if (!it) return;
        it.quantity += d; if (it.quantity <= 0) this.items.splice(idx, 1);
        this.#calc(); this.render();
      }

      removeItem(idx) { this.items.splice(idx, 1); this.#calc(); this.render(); }
      clear() { this.items = []; this.total = 0; this.render(); }
      get count() { return this.items.reduce((s, i) => s + i.quantity, 0); }

      render() {
        const badge = document.getElementById('cartBadge');
        badge.textContent = this.count;
        badge.classList.toggle('visible', this.count > 0);

        const body = document.getElementById('cartBody');
        body.innerHTML = this.items.length === 0
          ? `<div class="cart-empty">${ICON_BAG}<p>Your cart is empty</p></div>`
          : this.items.map((it, i) => `
            <div class="cart-item">
              <div class="cart-item__image"><img src="${it.product.image}" alt="" /></div>
              <div class="cart-item__info">
                <div class="cart-item__title">${it.product.title}</div>
                <div class="cart-item__price">$${(it.product.price * it.quantity).toFixed(2)}</div>
                <div class="cart-item__controls">
                  <button class="qty-btn" data-a="dec" data-i="${i}">−</button>
                  <span class="cart-item__qty">${it.quantity}</span>
                  <button class="qty-btn" data-a="inc" data-i="${i}">+</button>
                  <button class="remove-btn" data-a="rm" data-i="${i}" aria-label="Remove">${ICON_TRASH}</button>
                </div>
              </div>
            </div>`).join('');

        body.onclick = (e) => {
          const b = e.target.closest('[data-a]'); if (!b) return;
          const i = +b.dataset.i;
          if (b.dataset.a === 'dec') this.changeQty(i, -1);
          else if (b.dataset.a === 'inc') this.changeQty(i, 1);
          else if (b.dataset.a === 'rm') this.removeItem(i);
        };

        const footer = document.getElementById('cartFooter');
        footer.innerHTML = `
          <div class="cart-total"><span class="cart-total__label">Total</span><span class="cart-total__value">$${this.total.toFixed(2)}</span></div>
          <div class="cart-actions">
            <button class="btn-secondary" id="btnClear">Clear</button>
            <button class="btn-primary" id="btnOrder"${!this.items.length ? ' disabled' : ''}>Place Order</button>
          </div>`;

        footer.querySelector('#btnClear').onclick = () => this.clear();
        footer.querySelector('#btnOrder').onclick = () => {
          if (!this.items.length) return;
          if (!userMgr.isLoggedIn()) {
            closeDrawer('cart');
            setTimeout(() => userMgr.openDrawer('login'), 100);
            showToast('Sign in to place your order');
            return;
          }
          userMgr.orders.unshift({
            id: `ORD-${String(userMgr.orders.length + 1).padStart(4, '0')}`,
            date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
            items: this.items.map(i => ({ title: i.product.title, qty: i.quantity, price: i.product.price })),
            total: this.total, status: 'completed'
          });
          showToast('Order placed successfully!');
          this.clear();
          closeDrawer('cart');
        };
      }
    }

    // ─── USER MANAGER ───
    const userMgr = {
      user: null, token: null, avatarUrl: null, orders: [],

      isLoggedIn() { return !!this.token; },

      async login(username, password) {
        const res = await fetch('https://fakestoreapi.com/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) throw new Error('fail');
        this.token = (await res.json()).token;
        const users = await (await fetch('https://fakestoreapi.com/users')).json();
        this.user = users.find(u => u.username === username) || users[0];
        this.updateBtn();
        return this.user;
      },

      logout() {
        this.user = null; this.token = null; this.avatarUrl = null; this.orders = [];
        this.updateBtn();
        showToast('Signed out');
      },

      updateBtn() {
        const btn = document.getElementById('userToggle');
        const img = document.getElementById('headerAvatar');
        if (this.isLoggedIn()) {
          btn.classList.add('logged-in');
          if (this.avatarUrl) { img.src = this.avatarUrl; btn.classList.add('has-avatar'); }
          else { btn.classList.remove('has-avatar'); img.src = ''; }
        } else {
          btn.classList.remove('logged-in', 'has-avatar'); img.src = '';
        }
      },

      openDrawer(view) {
        const title = document.getElementById('userDrawerTitle');
        const body = document.getElementById('userBody');

        if (!this.isLoggedIn() || view === 'login') {
          title.textContent = 'Sign In';
          body.innerHTML = this._loginHTML();
          this._loginEvents(body);
        } else {
          title.textContent = 'My Account';
          body.innerHTML = this._profileHTML();
          this._profileEvents(body);
        }
        openDrawer('user');
      },

      _loginHTML() {
        return `<div class="login-form-wrapper">
          <p>Sign in to place orders, track your purchases, and manage your profile.</p>
          <div class="form-group"><label for="lu">Username</label><input type="text" id="lu" placeholder="mor_2314" /></div>
          <div class="form-group"><label for="lp">Password</label><input type="password" id="lp" placeholder="••••••••" /></div>
          <div id="lerr" style="color:var(--red);font-size:0.82rem;margin-bottom:8px;display:none"></div>
          <button class="btn-primary" id="lbtn" style="width:100%">Sign In</button>
          <div class="login-hint"><strong>Demo credentials:</strong><br>Username: <strong>mor_2314</strong><br>Password: <strong>83r5^_</strong></div>
        </div>`;
      },

      _loginEvents(c) {
        const btn = c.querySelector('#lbtn'), err = c.querySelector('#lerr');
        const go = async () => {
          const u = c.querySelector('#lu').value.trim(), p = c.querySelector('#lp').value;
          if (!u || !p) { err.textContent = 'Fill in both fields'; err.style.display = 'block'; return; }
          btn.innerHTML = `<span class="spinner-sm"></span> Signing in…`; btn.disabled = true; err.style.display = 'none';
          try {
            await this.login(u, p);
            showToast(`Welcome, ${this.user.name?.firstname || u}!`);
            closeDrawer('user');
          } catch {
            err.textContent = 'Invalid username or password'; err.style.display = 'block';
            btn.textContent = 'Sign In'; btn.disabled = false;
          }
        };
        btn.onclick = go;
        c.querySelector('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      },

      _profileHTML() {
        const u = this.user;
        const name = `${u.name?.firstname || ''} ${u.name?.lastname || ''}`.trim() || u.username;
        const av = this.avatarUrl ? `<img src="${this.avatarUrl}" alt="" />` : ICON_USER_LG;
        const addr = u.address ? `${u.address.number || ''} ${u.address.street || ''}, ${u.address.city || ''}`.trim() : '';

        return `<div class="profile-section">
          <div class="profile-avatar-area">
            <div class="profile-avatar" id="avTrig">${av}<div class="profile-avatar-overlay">${ICON_CAMERA}</div></div>
            <div class="profile-name">${name}</div>
            <div class="profile-email">${u.email || ''}</div>
          </div>
          <div class="profile-tabs">
            <button class="profile-tab active" data-tab="profile">Profile</button>
            <button class="profile-tab" data-tab="orders">Order History</button>
          </div>
          <div class="tab-content active" id="tab-profile">
            <div class="form-row">
              <div class="form-group"><label>First Name</label><input type="text" id="pf" value="${u.name?.firstname || ''}" /></div>
              <div class="form-group"><label>Last Name</label><input type="text" id="pl" value="${u.name?.lastname || ''}" /></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" value="${u.email || ''}" readonly /></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="pp" value="${u.phone || ''}" placeholder="+1 555 000 0000" /></div>
            <div class="form-group"><label>Address</label><input type="text" id="pa" value="${addr}" placeholder="123 Main St, City" /></div>
            <div class="form-group"><label>New Password</label><input type="password" id="pnp" placeholder="Leave blank to keep current" /></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" id="pcp" placeholder="Confirm new password" /></div>
            <div class="form-actions">
              <button class="btn-save" id="btnSave">Save Changes</button>
              <button class="btn-danger" id="btnOut">Sign Out</button>
            </div>
          </div>
          <div class="tab-content" id="tab-orders">${this._ordersHTML()}</div>
        </div>`;
      },

      _ordersHTML() {
        if (!this.orders.length) return `<div class="empty-state">${ICON_RECEIPT}<p>No orders yet</p></div>`;
        return this.orders.map(o => `
          <div class="order-card">
            <div class="order-card__header">
              <div><div class="order-card__id">${o.id}</div><div class="order-card__date">${o.date}</div></div>
              <span class="order-card__status order-card__status--${o.status}">${o.status}</span>
            </div>
            <div class="order-card__items">${o.items.map(it => `
              <div class="order-card__item"><span>${it.qty}× ${it.title.length > 32 ? it.title.slice(0, 32) + '…' : it.title}</span><span>$${(it.price * it.qty).toFixed(2)}</span></div>`).join('')}
            </div>
            <div class="order-card__total"><span>Total</span><span>$${o.total.toFixed(2)}</span></div>
          </div>`).join('');
      },

      _profileEvents(c) {
        // Tabs
        c.querySelectorAll('.profile-tab').forEach(tab => tab.onclick = () => {
          c.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
          c.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          c.querySelector(`#tab-${tab.dataset.tab}`).classList.add('active');
        });

        // Avatar
        c.querySelector('#avTrig')?.addEventListener('click', () => document.getElementById('avatarInput').click());

        // Save
        c.querySelector('#btnSave').onclick = () => {
          const np = c.querySelector('#pnp').value, cp = c.querySelector('#pcp').value;
          if (np && np !== cp) { showToast('Passwords do not match'); return; }
          this.user.name.firstname = c.querySelector('#pf').value;
          this.user.name.lastname = c.querySelector('#pl').value;
          this.user.phone = c.querySelector('#pp').value;
          const a = c.querySelector('#pa').value;
          if (a) { this.user.address = this.user.address || {}; this.user.address.street = a; }
          if (np) this.user.password = np;
          this.updateBtn();
          showToast('Profile updated!');
          const ne = c.querySelector('.profile-name');
          if (ne) ne.textContent = `${this.user.name.firstname} ${this.user.name.lastname}`.trim();
          c.querySelector('#pnp').value = ''; c.querySelector('#pcp').value = '';
        };

        // Logout
        c.querySelector('#btnOut').onclick = () => { this.logout(); closeDrawer('user'); };
      }
    };

    // Avatar file handler
    document.getElementById('avatarInput').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        userMgr.avatarUrl = ev.target.result;
        userMgr.updateBtn();
        if (document.getElementById('userDrawer').classList.contains('open')) userMgr.openDrawer();
        showToast('Avatar updated!');
      };
      r.readAsDataURL(f);
      e.target.value = '';
    };

    // ─── DRAWER OPEN/CLOSE ───
    function openDrawer(w) {
      document.getElementById(`${w}Overlay`).classList.add('open');
      document.getElementById(`${w}Drawer`).classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer(w) {
      document.getElementById(`${w}Overlay`).classList.remove('open');
      document.getElementById(`${w}Drawer`).classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('cartToggle').onclick = () => openDrawer('cart');
    document.getElementById('cartClose').onclick = () => closeDrawer('cart');
    document.getElementById('cartOverlay').onclick = () => closeDrawer('cart');
    document.getElementById('userToggle').onclick = () => userMgr.openDrawer();
    document.getElementById('userClose').onclick = () => closeDrawer('user');
    document.getElementById('userOverlay').onclick = () => closeDrawer('user');

    // ─── INIT ───
    const cart = ShoppingCart.getInstance();
    cart.render();
    new ProductList().fetchProducts();
  </script>
</body>
</html>
